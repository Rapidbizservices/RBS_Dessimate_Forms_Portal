name = "amy"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Not secret - which repo this backend saves into, and which single origin
# is allowed to call it (your GitHub Pages site). Change these if you ever
# rename the repo or move the site.
[vars]
GITHUB_OWNER = "Rapidbizservices"
GITHUB_REPO = "RBS_Dessimate_Forms_Portal"
ALLOWED_ORIGIN = "https://rapidbizservices.github.io"

# Secrets (set these with `wrangler secret put <NAME>` — see the README in
# this folder for exact commands):
#   GITHUB_TOKEN    - a GitHub PAT with Contents: Read and write on the repo
#   SESSION_SECRET  - random string, used to sign staff login sessions
#   STAFF_USERS     - JSON array of {username, salt, hash} - generate each
#                     entry with password_hash_tool.html
