name = "roberto"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Not secret - the one origin allowed to call this backend (your GitHub Pages
# site). Change this if you ever move the site to a different address.
# RESEND_FROM_EMAIL - not secret either, just the "from" address MFA email
# codes are sent from. Must be a verified sender/domain in your Resend
# account, or Resend will reject the send - see worker/README.md's
# Multi-factor authentication section.
[vars]
ALLOWED_ORIGIN = "https://rapidbizservices.github.io"
RESEND_FROM_EMAIL = "DSCM <IT_Dessimate@dessimate.com>"
# Weekly Open Issues recap email (Wednesdays 9:30 pm Pacific) to Customer
# and Dessimate users. "true" = on, "false" = off. Preview it with
# POST /admin/open-issues-recap/preview - see worker/README.md.
OPEN_ISSUES_RECAP_ENABLED = "true"

# Cloudflare-native storage bindings - replaces the old GitHub-backed
# storage entirely. Both resources already exist in your Cloudflare account
# (created by the one-time setup workflow) - this just wires the Worker to
# them.
[[d1_databases]]
binding = "DB"
database_name = "dscm-db"
database_id = "5e6c1f37-8995-4425-bdad-b8f4e7985743"

[[r2_buckets]]
binding = "FILES"
bucket_name = "dscm-files"

# RFQ quote-due reminder scan (48h + 2h before each Supplier/Customer
# effective deadline). A worker deploy is what registers this schedule
# with Cloudflare - editing the file locally is not enough.
[triggers]
crons = ["*/15 * * * *"]

# Secrets (set these with `wrangler secret put <NAME>` - see the README in
# this folder for exact commands):
#   SESSION_SECRET  - random string, used to sign staff login sessions
#   STAFF_USERS     - JSON array of {username, salt, hash} - generate each
#                     entry with password_hash_tool.html. Every current
#                     account is already migrated into data/users.json, so
#                     this can simply be "[]" on this new backend.
#   MIGRATION_KEY   - TEMPORARY, only needed once. A random string that
#                     guards the one-time /admin/migrate-from-github route
#                     (see worker/README.md). Delete this secret once the
#                     migration is confirmed complete.
#   MFA_SECRET      - random string (different from SESSION_SECRET - keep
#                     them separate). Signs the short-lived MFA "pending"
#                     and "step-up" tokens, and is the key material for
#                     encrypting TOTP secrets at rest. See worker/README.md's
#                     Multi-factor authentication section.
#   ANTHROPIC_API_KEY - from console.anthropic.com (a paid Anthropic
#                     organization). Required for the 8D button on Customer
#                     and Supplier Open Issues. The key stays only as a
#                     Cloudflare secret. Issue text, photos, and the PDF are
#                     not stored in git. Optional var ANTHROPIC_MODEL
#                     overrides the default model (claude-sonnet-5-5).
#   RESEND_API_KEY  - from your Resend account (resend.com, free tier).
#                     Sends MFA email one-time codes AND RFQ quote-due
#                     extension/reminder emails. Once set, every account
#                     with an email on file automatically sees "use email
#                     code instead" at MFA login - no per-user opt-in.
#                     MFA still works with just an authenticator app if
#                     this is never set - only email (MFA fallback + RFQ
#                     due notices) needs it.
# Note: GITHUB_TOKEN is no longer used - this backend never talks to GitHub
# for anything except the one-time migration, which reads the old public
# repo's already-public files with no token at all.
