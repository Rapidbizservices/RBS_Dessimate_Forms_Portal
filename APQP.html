<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APQP &mdash; DSCM</title>
<style>
  :root{
    --brand:#2b4ea3;
    --brand-dark:#1c3877;
    --ink:#1c1c1e;
    --label:#5b5f66;
    --line:#dde0e6;
    --bg:#f4f5f8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:24px 16px 60px; background:var(--bg); color:var(--ink);
    font-family:Arial,Helvetica,sans-serif; display:flex; flex-direction:column; align-items:center;
  }
  .wrap{ width:100%; max-width:560px; }

  .header{ display:flex; align-items:center; justify-content:space-between; gap:16px;
    flex-wrap:wrap; margin-bottom:6px; }
  .header-left{ display:flex; align-items:center; gap:12px; }
  .header-left img{ width:44px; height:auto; }
  .header-left h1{ font-size:19px; margin:0; }
  .header-left .sub{ font-size:12.5px; color:var(--label); margin:2px 0 0; }
  .homeBtn{
    font-family:inherit; font-size:14.5px; font-weight:700; color:var(--brand); background:#fff;
    border:1px solid var(--brand); border-radius:8px; padding:11px 20px; cursor:pointer; text-decoration:none;
    white-space:nowrap; display:inline-block;
  }
  .homeBtn:hover{ background:#eef1fa; }

  .ghbar{ display:flex; align-items:center; justify-content:flex-end; gap:8px;
    font-size:12.5px; margin:10px 0 24px; }
  #ghStatus.gh-ok{ color:#187b46; font-weight:600; }
  #ghStatus.gh-off{ color:#a06a1c; font-weight:600; }
  #ghConnectBtn{ font-family:inherit; font-size:12px; color:var(--brand); background:#eef1fa;
    border:1px solid #cdd6ee; border-radius:6px; padding:5px 10px; cursor:pointer; }
  #ghConnectBtn:hover{ background:#e2e8f9; }

  /* Staff login wall */
  .authOverlay{ display:none; position:fixed; inset:0; background:rgba(20,22,28,.6);
    z-index:2000; align-items:center; justify-content:center; padding:20px; }
  .authOverlay.open{ display:flex; }
  .authCard{ background:#fff; border-radius:12px; padding:28px 30px; width:100%; max-width:340px;
    box-shadow:0 20px 60px rgba(0,0,0,.3); text-align:left; }
  .authCard h2{ font-size:16px; border:none; padding:0; margin:0 0 4px; color:var(--ink); }
  .authCard .authSub{ font-size:12.5px; color:var(--label); margin:0 0 18px; }
  .authCard label{ display:block; font-size:12px; color:var(--label); font-weight:600; margin-bottom:12px; }
  .authCard input{ display:block; width:100%; margin-top:5px; font-family:inherit; font-size:14px;
    padding:9px 10px; border:1px solid var(--line); border-radius:6px; }
  .authCard button{ width:100%; font-family:inherit; font-size:14.5px; font-weight:700; color:#fff;
    background:var(--brand); border:none; border-radius:8px; padding:11px; cursor:pointer; margin-top:4px; }
  .authCard button:hover{ background:var(--brand-dark); }
  .authCard button:disabled{ background:#9fb0d8; cursor:wait; }
  .authError{ font-size:12.5px; color:#b23b3b; font-weight:600; min-height:16px; margin-top:10px; }

  .stageList{ display:flex; flex-direction:column; gap:10px; }
  .stageBtn{
    display:flex; align-items:center; gap:12px;
    font-family:inherit; font-size:15px; font-weight:700; text-decoration:none;
    border-radius:10px; padding:15px 20px; text-align:left; width:100%; border:1px solid var(--line);
  }
  .stageNum{
    flex:0 0 auto; width:26px; height:26px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:12.5px; font-weight:700;
  }

  .stageBtn.active{ color:#fff; background:var(--brand); border-color:var(--brand); cursor:pointer; }
  .stageBtn.active .stageNum{ background:rgba(255,255,255,.22); color:#fff; }
  .stageBtn.active:hover{ background:var(--brand-dark); }

  .stageBtn.placeholder{
    color:#9a9ea6; background:#fff; cursor:default;
  }
  .stageBtn.placeholder .stageNum{ background:#eef0f4; color:#9a9ea6; }
  .stageBtn.placeholder .comingSoon{ margin-left:auto; font-size:11px; font-weight:700; text-transform:uppercase;
    letter-spacing:.03em; color:#b7bac0; white-space:nowrap; }

  footer{ margin-top:28px; font-size:11.5px; color:#9a9ea6; text-align:center; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div class="header-left">
        <img src="logo.jpg" alt="Dessimate">
        <div>
          <h1>APQP</h1>
          <p class="sub">Advanced Product Quality Planning &mdash; select a stage.</p>
        </div>
      </div>
      <a class="homeBtn" href="index.html">Home</a>
    </div>

    <div class="ghbar">
      <span id="ghStatus">Checking sign-in&hellip;</span>
      <button type="button" id="ghConnectBtn">Log out</button>
    </div>

    <div class="stageList">
      <button type="button" class="stageBtn placeholder" disabled><span class="stageNum">1</span> Design Record <span class="comingSoon">Coming soon</span></button>
      <button type="button" class="stageBtn placeholder" disabled><span class="stageNum">2</span> Control Plan <span class="comingSoon">Coming soon</span></button>
      <button type="button" class="stageBtn placeholder" disabled><span class="stageNum">3</span> Dim Results <span class="comingSoon">Coming soon</span></button>
      <button type="button" class="stageBtn placeholder" disabled><span class="stageNum">4</span> M/P Tests <span class="comingSoon">Coming soon</span></button>
      <button type="button" class="stageBtn placeholder" disabled><span class="stageNum">5</span> IPS <span class="comingSoon">Coming soon</span></button>
      <button type="button" class="stageBtn placeholder" disabled><span class="stageNum">6</span> Sample Product <span class="comingSoon">Coming soon</span></button>
      <button type="button" class="stageBtn placeholder" disabled><span class="stageNum">7</span> Master Sample <span class="comingSoon">Coming soon</span></button>
      <button type="button" class="stageBtn placeholder" disabled><span class="stageNum">8</span> Other <span class="comingSoon">Coming soon</span></button>
      <a class="stageBtn active" href="PSW_Form_Filler.html"><span class="stageNum">9</span> PSW</a>
    </div>

    <footer>Dessimate &middot; DSCM &middot; APQP</footer>
  </div>

  <div class="authOverlay" id="authOverlay">
    <div class="authCard">
      <h2>Staff Sign-In</h2>
      <p class="authSub">Sign in with the username and password you were given to use the DSCM system.</p>
      <form id="authForm">
        <label>Username
          <input type="text" id="authUsername" autocomplete="username" autofocus>
        </label>
        <label>Password
          <input type="password" id="authPassword" autocomplete="current-password">
        </label>
        <button type="submit" id="authSubmitBtn">Log In</button>
        <div class="authError" id="authError"></div>
      </form>
    </div>
  </div>

  <script>
    // Same Worker/session mechanism as every other page in this system - see
    // worker/README.md. EDIT WORKER_BASE_URL below once after you deploy the
    // Worker; it must match the value used in every other HTML file.
    var WORKER_BASE_URL = 'https://amy.dessimate.workers.dev';
    var SESSION_KEY = 'dessimate_session';

    function getSession(){
      try{
        var raw = localStorage.getItem(SESSION_KEY);
        if (!raw) return null;
        var s = JSON.parse(raw);
        if (!s || !s.token || !s.expiresAt || s.expiresAt <= Date.now()) return null;
        return s;
      }catch(e){ return null; }
    }
    function setSession(s){ try{ localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }catch(e){} }
    function clearSession(){ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }

    var pendingAfterAuth = null;

    function refreshGhStatus(){
      var statusEl = document.getElementById('ghStatus');
      var btn = document.getElementById('ghConnectBtn');
      if (!statusEl || !btn) return;
      var session = getSession();
      if (session) {
        statusEl.textContent = 'Welcome, ' + session.username;
        statusEl.className = 'gh-ok';
        btn.textContent = 'Log out';
      } else {
        statusEl.textContent = 'Not signed in';
        statusEl.className = 'gh-off';
        btn.textContent = 'Log out';
      }
    }
    function showAuthOverlay(){
      var overlay = document.getElementById('authOverlay');
      if (overlay) overlay.classList.add('open');
      refreshGhStatus();
    }
    function hideAuthOverlay(){
      var overlay = document.getElementById('authOverlay');
      if (overlay) overlay.classList.remove('open');
      refreshGhStatus();
    }
    function requireAuthThen(fn){
      if (getSession()) { hideAuthOverlay(); fn(); }
      else { pendingAfterAuth = fn; showAuthOverlay(); }
    }

    document.getElementById('authForm').addEventListener('submit', async function(e){
      e.preventDefault();
      var username = document.getElementById('authUsername').value.trim();
      var password = document.getElementById('authPassword').value;
      var errEl = document.getElementById('authError');
      var btn = document.getElementById('authSubmitBtn');
      errEl.textContent = '';
      if (!username || !password) { errEl.textContent = 'Enter your username and password.'; return; }
      btn.disabled = true; btn.textContent = 'Logging in…';
      try {
        var res = await fetch(WORKER_BASE_URL + '/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password })
        });
        var data = await res.json();
        if (!res.ok) throw new Error(data.message || ('HTTP ' + res.status));
        setSession({ token: data.token, username: data.username, expiresAt: data.expiresAt });
        document.getElementById('authPassword').value = '';
        hideAuthOverlay();
        var fn = pendingAfterAuth; pendingAfterAuth = null;
        if (fn) fn();
      } catch (err) {
        console.error(err);
        errEl.textContent = err && err.message ? err.message : 'Could not log in — check the backend is reachable.';
      } finally {
        btn.disabled = false; btn.textContent = 'Log In';
      }
    });
    document.getElementById('ghConnectBtn').addEventListener('click', function(){
      clearSession();
      showAuthOverlay();
    });

    requireAuthThen(function(){});
  </script>
</body>
</html>
