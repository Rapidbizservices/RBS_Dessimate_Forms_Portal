<!doctype html>
<meta charset="utf-8">
<title>PDIR Portal</title>
<style>
  :root{
    --brand:#2b4ea3;
    --brand-dark:#1c3877;
    --ink:#1c1c1e;
    --label:#5b5f66;
    --line:#dde0e6;
    --bg:#f4f5f8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:24px 16px 60px; background:var(--bg); color:var(--ink);
    font-family:Arial,Helvetica,sans-serif; display:flex; flex-direction:column; align-items:center;
  }
  .wrap{ width:100%; max-width:860px; }

  .header{ display:flex; align-items:center; justify-content:space-between; gap:16px;
    flex-wrap:wrap; margin-bottom:6px; }
  .header-left{ display:flex; align-items:center; gap:12px; }
  .header-left img{ width:44px; height:auto; }
  .header-left h1{ font-size:19px; margin:0; }
  .header-left .sub{ font-size:12.5px; color:var(--label); margin:2px 0 0; }

  .createBtn{
    font-family:inherit; font-size:14.5px; font-weight:700; color:#fff; background:#1f9254;
    border:none; border-radius:8px; padding:12px 22px; cursor:pointer; text-decoration:none;
    white-space:nowrap; display:inline-block;
  }
  .createBtn:hover{ background:#187b46; }

  .ghbar{ display:flex; align-items:center; justify-content:flex-end; gap:8px;
    font-size:12.5px; margin:10px 0 18px; }
  #ghStatus.gh-ok{ color:#187b46; font-weight:600; }
  #ghStatus.gh-off{ color:#a06a1c; font-weight:600; }
  #ghConnectBtn{ font-family:inherit; font-size:12px; color:var(--brand); background:#eef1fa;
    border:1px solid #cdd6ee; border-radius:6px; padding:5px 10px; cursor:pointer; }
  #ghConnectBtn:hover{ background:#e2e8f9; }

  .toolbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .toolbar h2{ font-size:14px; margin:0; color:var(--ink); }
  #refreshBtn{ font-family:inherit; font-size:12.5px; color:var(--brand); background:#fff;
    border:1px solid var(--line); border-radius:7px; padding:6px 12px; cursor:pointer; }
  #refreshBtn:hover{ background:#eef1fa; }

  .panel{ background:#fff; border:1px solid var(--line); border-radius:10px; overflow:hidden; }

  .pdir-row{ display:flex; align-items:center; gap:14px; padding:13px 18px;
    border-bottom:1px solid var(--line); }
  .pdir-row:last-child{ border-bottom:none; }
  .pdir-main{ flex:1 1 auto; min-width:0; }
  .pdir-name{ font-weight:700; font-size:14px; overflow-wrap:break-word; }
  .pdir-name .pill{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;
    border-radius:4px; padding:2px 7px; margin-left:8px; vertical-align:1px; white-space:nowrap; }
  .pill.pill-done{ background:#e6f4ea; color:#187b46; }
  .pill.pill-draft{ background:#fdf1de; color:#a06a1c; }
  .pill.pill-hidden{ background:#f1e6f6; color:#7a3fa0; }
  .pdir-meta{ font-size:12px; color:var(--label); white-space:nowrap; margin-top:2px; }
  .pdir-actions{ display:flex; gap:8px; flex:0 0 auto; }
  .pdir-view, .pdir-modify, .pdir-delete, .pdir-restore{
    font-family:inherit; font-size:13px; font-weight:600; text-decoration:none;
    border-radius:6px; padding:6px 14px; white-space:nowrap; cursor:pointer; }
  .pdir-view{ color:var(--brand); background:#fff; border:1px solid var(--brand); }
  .pdir-view:hover{ background:#eef1fa; }
  .pdir-modify{ color:#fff; background:var(--brand); border:1px solid var(--brand); }
  .pdir-modify:hover{ background:var(--brand-dark); }
  .pdir-delete{ color:#b23b3b; background:#fff; border:1px solid #e3b3b3; }
  .pdir-delete:hover{ background:#fbeaea; border-color:#b23b3b; }
  .pdir-restore{ color:#187b46; background:#fff; border:1px solid #9fd6b6; }
  .pdir-restore:hover{ background:#e9f6ee; }
  .pdir-row.is-hidden{ opacity:.6; }

  .hiddenToggle{ display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--label);
    cursor:pointer; user-select:none; }
  .hiddenToggle input{ cursor:pointer; }

  .state{ padding:34px 18px; text-align:center; color:var(--label); font-size:13.5px; }
  .state.error{ color:#b23b3b; }
  .state a{ color:var(--brand); font-weight:600; }

  footer{ margin-top:24px; font-size:11.5px; color:#9a9ea6; text-align:center; }

  /* In-page PDF viewer */
  .viewerOverlay{
    display:none; position:fixed; inset:0; background:rgba(20,22,28,.55);
    z-index:1000; padding:22px; align-items:center; justify-content:center;
  }
  .viewerOverlay.open{ display:flex; }
  .viewerPanel{
    background:#fff; border-radius:10px; width:100%; max-width:980px; height:100%;
    display:flex; flex-direction:column; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.3);
  }
  .viewerBar{ display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:12px 16px; border-bottom:1px solid var(--line); }
  .viewerTitle{ font-size:14px; font-weight:700; overflow-wrap:anywhere; }
  .viewerBtns{ display:flex; gap:8px; flex:0 0 auto; }
  .viewerBtns a, .viewerBtns button{
    font-family:inherit; font-size:13px; font-weight:600; text-decoration:none; cursor:pointer;
    border-radius:6px; padding:7px 14px; white-space:nowrap;
  }
  #viewerDownload{ color:var(--brand); background:#fff; border:1px solid var(--brand); }
  #viewerDownload:hover{ background:#eef1fa; }
  #viewerClose{ color:#fff; background:#5b5f66; border:1px solid #5b5f66; }
  #viewerClose:hover{ background:#3f4248; }
  .viewerBody{ flex:1 1 auto; position:relative; background:#525659; }
  .viewerBody iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
  .viewerBody .viewerState{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:13.5px; text-align:center; padding:20px; flex-direction:column; gap:10px;
  }
  .viewerBody .viewerState a{ color:#bcd2ff; }
</style>

<div class="wrap">
  <div class="header">
    <div class="header-left">
      <img src="logo.jpg" alt="Dessimate">
      <div>
        <h1>PDIR Portal</h1>
        <p class="sub">Previously created Pre-Dispatch Inspection Reports, straight from the repo.</p>
      </div>
    </div>
    <a class="createBtn" href="PDIR_Form_Filler.html">Create a PDIR</a>
  </div>

  <div class="ghbar">
    <span id="ghStatus">GitHub: checking&hellip;</span>
    <button type="button" id="ghConnectBtn">Connect GitHub</button>
  </div>

  <div class="toolbar">
    <h2>Previous PDIRs</h2>
    <div style="display:flex; align-items:center; gap:14px;">
      <label class="hiddenToggle"><input type="checkbox" id="showHiddenToggle"> Show removed PDIRs</label>
      <button type="button" id="refreshBtn">Refresh</button>
    </div>
  </div>

  <div class="panel">
    <div id="loadingState" class="state">Loading previous PDIRs&hellip;</div>
    <div id="emptyState" class="state" style="display:none;">
      No PDIRs yet. Click <strong>Create a PDIR</strong> above to make the first one.
    </div>
    <div id="errorState" class="state error" style="display:none;"></div>
    <div id="pdirList"></div>
  </div>

  <footer>Dessimate &middot; PDIR Portal &middot; Form QF-PDIR-01</footer>
</div>

<div id="viewerOverlay" class="viewerOverlay">
  <div class="viewerPanel">
    <div class="viewerBar">
      <div class="viewerTitle" id="viewerTitle">PDF</div>
      <div class="viewerBtns">
        <a id="viewerDownload" href="#" style="display:none;">Download</a>
        <button type="button" id="viewerClose">Close</button>
      </div>
    </div>
    <div class="viewerBody">
      <div id="viewerState" class="viewerState">Loading PDF&hellip;</div>
      <iframe id="viewerFrame" title="PDF preview" style="display:none;"></iframe>
    </div>
  </div>
</div>

<script>
(function(){
  // ---- GitHub (Contents API) ------------------------------------------------
  // This page is a static file with no server of its own, so listing what's in
  // the repo means calling GitHub's REST API directly from the browser. Public
  // repos can be listed without a token (rate-limited to 60 requests/hour);
  // connecting a token raises that limit a lot and is required for a private repo.
  var GH_OWNER = 'Rapidbizservices';
  var GH_REPO = 'RBS_Dessimate_Forms_Portal';
  var GH_PDF_FOLDER = 'pdirs';
  var GH_DRAFT_FOLDER = 'pdir_drafts';
  var GH_TOKEN_KEY = 'dessimate_gh_token';

  function ghToken(){ try{ return localStorage.getItem(GH_TOKEN_KEY) || ''; }catch(e){ return ''; } }
  function ghSetToken(t){ try{ if(t) localStorage.setItem(GH_TOKEN_KEY, t); else localStorage.removeItem(GH_TOKEN_KEY); }catch(e){} }
  function ghHeaders(extra){
    var h = { 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
    var t = ghToken();
    if (t) h['Authorization'] = 'Bearer ' + t;
    if (extra) Object.keys(extra).forEach(function(k){ h[k] = extra[k]; });
    return h;
  }
  function ghApiUrl(path){ return 'https://api.github.com/repos/' + GH_OWNER + '/' + GH_REPO + '/' + path; }

  async function ghListFolder(folder){
    var res = await fetch(ghApiUrl('contents/' + folder), { headers: ghHeaders() });
    if (res.status === 404) return [];
    if (!res.ok) {
      var txt = '';
      try { txt = (await res.json()).message || ''; } catch(e){}
      throw new Error('HTTP ' + res.status + (txt ? ' — ' + txt : ''));
    }
    var items = await res.json();
    return Array.isArray(items) ? items : [];
  }

  async function ghGetLastCommitDate(fullPath){
    try {
      var path = 'commits?path=' + encodeURIComponent(fullPath) + '&per_page=1';
      var res = await fetch(ghApiUrl(path), { headers: ghHeaders() });
      if (!res.ok) return null;
      var data = await res.json();
      if (data && data[0] && data[0].commit && data[0].commit.committer) return data[0].commit.committer.date;
    } catch(e){}
    return null;
  }

  function ghContentsUrl(fullPath){
    return ghApiUrl('contents/' + fullPath.split('/').map(encodeURIComponent).join('/'));
  }
  function bytesToBase64(bytes){
    var binary = '', chunk = 0x8000;
    for (var i = 0; i < bytes.length; i += chunk) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(binary);
  }
  function base64ToBytes(b64){
    var bin = atob((b64 || '').replace(/\s+/g, ''));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }
  async function ghGetSha(fullPath){
    var res = await fetch(ghContentsUrl(fullPath), { headers: ghHeaders() });
    if (res.status === 404) return null;
    if (!res.ok) throw new Error('GitHub error ' + res.status);
    var data = await res.json();
    return data.sha;
  }
  async function ghGetFileContent(fullPath){
    var res = await fetch(ghContentsUrl(fullPath), { headers: ghHeaders() });
    if (res.status === 404) return null;
    if (!res.ok) throw new Error('GitHub error ' + res.status + ' while loading ' + fullPath + '.');
    var data = await res.json();
    return new TextDecoder('utf-8').decode(base64ToBytes(data.content || ''));
  }
  async function ghPutFile(fullPath, bytes, commitMessage){
    var token = ghToken();
    if (!token) throw new Error('No GitHub token configured.');
    var sha = await ghGetSha(fullPath);
    var body = { message: commitMessage || ('Save ' + fullPath), content: bytesToBase64(bytes) };
    if (sha) body.sha = sha;
    var res = await fetch(ghContentsUrl(fullPath), {
      method: 'PUT',
      headers: ghHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify(body)
    });
    if (!res.ok) {
      var txt = '';
      try { txt = (await res.json()).message || ''; } catch(e){}
      throw new Error('HTTP ' + res.status + (txt ? ' — ' + txt : ''));
    }
    return await res.json();
  }
  // ---- Soft delete: "Remove from Portal" never touches the actual files in
  // pdirs/ or pdir_drafts/ — it only adds the title to a small shared list so
  // everyone's Portal knows to hide it. An admin can always see the real files
  // in GitHub, or use "Show removed PDIRs" here to restore one. ------------
  var HIDDEN_FILE = 'pdir_meta/hidden.json';

  async function loadHiddenTitles(){
    try {
      var text = await ghGetFileContent(HIDDEN_FILE);
      if (!text) return [];
      var data = JSON.parse(text);
      return Array.isArray(data.hidden) ? data.hidden : [];
    } catch(e){ console.error(e); return []; }
  }
  async function saveHiddenTitles(list){
    var bytes = new TextEncoder().encode(JSON.stringify({ hidden: list }));
    await ghPutFile(HIDDEN_FILE, bytes, 'Update PDIR Portal hidden list');
  }
  async function setHidden(title, hidden){
    if (!ghToken()) {
      alert('Connect GitHub first (top right) — removing or restoring a PDIR needs write access to save that change.');
      return;
    }
    try {
      var current = await loadHiddenTitles();
      var next = hidden
        ? (current.indexOf(title) === -1 ? current.concat([title]) : current)
        : current.filter(function(t){ return t !== title; });
      await saveHiddenTitles(next);
      await loadPdirList();
    } catch(e) {
      console.error(e);
      alert((hidden ? 'Could not remove' : 'Could not restore') + ' this PDIR (' + e.message + ').');
    }
  }
  // -----------------------------------------------------------------------------

  function refreshGhStatus(){
    var t = ghToken();
    var statusEl = document.getElementById('ghStatus');
    var btn = document.getElementById('ghConnectBtn');
    if (t) {
      statusEl.textContent = 'GitHub: connected';
      statusEl.className = 'gh-ok';
      btn.textContent = 'Change token';
    } else {
      statusEl.textContent = 'GitHub: not connected (read-only, public repo)';
      statusEl.className = 'gh-off';
      btn.textContent = 'Connect GitHub';
    }
  }
  document.getElementById('ghConnectBtn').addEventListener('click', function(){
    var current = ghToken();
    var msg = current
      ? 'Paste a new GitHub personal access token to replace the saved one, or clear the box and press OK to disconnect.\n\nThe token needs "Contents: Read and write" access to ' + GH_OWNER + '/' + GH_REPO + '.'
      : 'Paste a GitHub personal access token with "Contents: Read and write" access to ' + GH_OWNER + '/' + GH_REPO + '.\n\nCreate one at github.com -> Settings -> Developer settings -> Fine-grained tokens. It is stored only in this browser, never sent anywhere except api.github.com.';
    var val = window.prompt(msg, current || '');
    if (val === null) return;
    ghSetToken(val.trim());
    refreshGhStatus();
    loadPdirList();
  });
  refreshGhStatus();
  // -----------------------------------------------------------------------------

  function escapeHtml(s){
    return (s || '').replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  // ---- In-page PDF viewer -----------------------------------------------
  // GitHub's raw file host serves PDFs as application/octet-stream, which
  // makes a plain link download instead of preview. Fetching the bytes
  // ourselves and handing them to the iframe as a Blob with an explicit
  // application/pdf type makes the browser's own PDF viewer render it
  // inline instead — the person can still use that viewer's own download
  // button (or the one in the bar above it) if they want to save the file.
  var viewerObjectUrl = null;

  function closePdfViewer(){
    document.getElementById('viewerOverlay').classList.remove('open');
    document.getElementById('viewerFrame').src = 'about:blank';
    document.getElementById('viewerFrame').style.display = 'none';
    document.getElementById('viewerDownload').style.display = 'none';
    if (viewerObjectUrl) { URL.revokeObjectURL(viewerObjectUrl); viewerObjectUrl = null; }
  }
  document.getElementById('viewerClose').addEventListener('click', closePdfViewer);
  document.getElementById('viewerOverlay').addEventListener('click', function(e){
    if (e.target.id === 'viewerOverlay') closePdfViewer();
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && document.getElementById('viewerOverlay').classList.contains('open')) closePdfViewer();
  });

  async function openPdfViewer(title, url){
    var overlay = document.getElementById('viewerOverlay');
    var stateEl = document.getElementById('viewerState');
    var frame = document.getElementById('viewerFrame');
    var downloadBtn = document.getElementById('viewerDownload');
    document.getElementById('viewerTitle').textContent = title;
    frame.style.display = 'none';
    downloadBtn.style.display = 'none';
    stateEl.style.display = 'flex';
    stateEl.textContent = 'Loading PDF…';
    overlay.classList.add('open');
    try {
      var res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var bytes = await res.arrayBuffer();
      var blob = new Blob([bytes], { type: 'application/pdf' });
      if (viewerObjectUrl) URL.revokeObjectURL(viewerObjectUrl);
      viewerObjectUrl = URL.createObjectURL(blob);
      frame.src = viewerObjectUrl;
      frame.style.display = 'block';
      stateEl.style.display = 'none';
      downloadBtn.href = viewerObjectUrl;
      downloadBtn.download = title + '.pdf';
      downloadBtn.style.display = 'inline-block';
    } catch (err) {
      console.error(err);
      stateEl.innerHTML = 'Could not load the PDF for preview (' + escapeHtml(err.message) + ').<br><a href="' + url + '" target="_blank" rel="noopener">Open it directly instead</a>';
    }
  }
  // -------------------------------------------------------------------------

  // Each entry is keyed by its title ("PDIR for Shipment # ..."), which is the
  // shared base filename between the finished PDF (pdirs/<title>.pdf) and the
  // resumable draft (pdir_drafts/<title>.json) — so one row can represent both.
  var lastEntries = [];
  var showHidden = false;

  function renderList(){
    var listEl = document.getElementById('pdirList');
    var emptyEl = document.getElementById('emptyState');
    listEl.innerHTML = '';
    emptyEl.style.display = 'none';

    var visible = showHidden ? lastEntries : lastEntries.filter(function(e){ return !e.hidden; });

    if (!visible.length) {
      emptyEl.style.display = 'block';
      emptyEl.textContent = (lastEntries.length && !showHidden)
        ? 'Every PDIR is currently removed from view. Check "Show removed PDIRs" above to see and restore them.'
        : 'No PDIRs yet.';
      return;
    }

    visible.forEach(function(e){
      var latestDate = e.latest ? new Date(e.latest).toLocaleString() : '';
      var sizeKb = e.pdf && e.pdf.size ? Math.round(e.pdf.size / 1024) + ' KB' : '';
      var meta = [latestDate, sizeKb].filter(Boolean).join(' · ');
      var pill = e.pdf
        ? '<span class="pill pill-done">Completed</span>'
        : '<span class="pill pill-draft">Draft</span>';
      if (e.hidden) pill += '<span class="pill pill-hidden">Removed</span>';
      var modifyHref = 'PDIR_Form_Filler.html?shipment=' + encodeURIComponent(e.title);

      var row = document.createElement('div');
      row.className = 'pdir-row' + (e.hidden ? ' is-hidden' : '');
      row.innerHTML =
        '<div class="pdir-main">' +
          '<div class="pdir-name">' + escapeHtml(e.title) + pill + '</div>' +
          '<div class="pdir-meta">' + escapeHtml(meta) + '</div>' +
        '</div>' +
        '<div class="pdir-actions">' +
          (e.pdf ? '<button type="button" class="pdir-view">View PDF</button>' : '') +
          '<a class="pdir-modify" href="' + modifyHref + '">Modify PDIR</a>' +
          (e.hidden
            ? '<button type="button" class="pdir-restore">Restore</button>'
            : '<button type="button" class="pdir-delete">Delete</button>') +
        '</div>';
      if (e.pdf) {
        row.querySelector('.pdir-view').addEventListener('click', function(){
          openPdfViewer(e.title, e.pdf.download_url);
        });
      }
      if (e.hidden) {
        row.querySelector('.pdir-restore').addEventListener('click', function(){
          setHidden(e.title, false);
        });
      } else {
        row.querySelector('.pdir-delete').addEventListener('click', function(){
          if (!confirm('Remove "' + e.title + '" from the Portal?\n\n' +
            'This only hides it here — the PDF and draft files stay in the pdirs / pdir_drafts folders ' +
            'of your GitHub repo, so an admin can still find them there or restore this from "Show removed PDIRs".')) return;
          setHidden(e.title, true);
        });
      }
      listEl.appendChild(row);
    });
  }

  async function loadPdirList(){
    var emptyEl = document.getElementById('emptyState');
    var errorEl = document.getElementById('errorState');
    var loadingEl = document.getElementById('loadingState');
    document.getElementById('pdirList').innerHTML = '';
    errorEl.style.display = 'none';
    emptyEl.style.display = 'none';
    loadingEl.style.display = 'block';
    loadingEl.textContent = 'Loading previous PDIRs…';
    try {
      var results = await Promise.all([ghListFolder(GH_PDF_FOLDER), ghListFolder(GH_DRAFT_FOLDER), loadHiddenTitles()]);
      var pdfFiles = results[0].filter(function(it){ return it.type === 'file' && /\.pdf$/i.test(it.name); });
      var draftFiles = results[1].filter(function(it){ return it.type === 'file' && /\.json$/i.test(it.name); });
      var hiddenTitles = results[2];

      var map = {};
      pdfFiles.forEach(function(f){
        var title = f.name.replace(/\.pdf$/i, '');
        map[title] = map[title] || { title: title };
        map[title].pdf = f;
      });
      draftFiles.forEach(function(f){
        var title = f.name.replace(/\.json$/i, '');
        map[title] = map[title] || { title: title };
        map[title].draft = f;
      });
      var entries = Object.keys(map).map(function(k){ return map[k]; });
      entries.forEach(function(e){ e.hidden = hiddenTitles.indexOf(e.title) !== -1; });

      if (!entries.length) {
        loadingEl.style.display = 'none';
        emptyEl.style.display = 'block';
        emptyEl.textContent = 'No PDIRs yet. Click "Create a PDIR" above to make the first one.';
        lastEntries = [];
        return;
      }

      await Promise.all(entries.map(async function(e){
        if (e.pdf) e.pdfDate = await ghGetLastCommitDate(GH_PDF_FOLDER + '/' + e.pdf.name);
        if (e.draft) e.draftDate = await ghGetLastCommitDate(GH_DRAFT_FOLDER + '/' + e.draft.name);
      }));
      entries.forEach(function(e){
        var pd = e.pdfDate ? new Date(e.pdfDate).getTime() : 0;
        var dd = e.draftDate ? new Date(e.draftDate).getTime() : 0;
        e.latest = Math.max(pd, dd);
      });
      entries.sort(function(a, b){ return b.latest - a.latest; });

      loadingEl.style.display = 'none';
      lastEntries = entries;
      renderList();
    } catch (err) {
      console.error(err);
      loadingEl.style.display = 'none';
      errorEl.style.display = 'block';
      errorEl.textContent = 'Could not load previous PDIRs (' + err.message + '). ' +
        'If this repo is private, click "Connect GitHub" above and add a token.';
    }
  }

  document.getElementById('refreshBtn').addEventListener('click', loadPdirList);
  document.getElementById('showHiddenToggle').addEventListener('change', function(){
    showHidden = this.checked;
    renderList();
  });
  loadPdirList();
})();
</script>
